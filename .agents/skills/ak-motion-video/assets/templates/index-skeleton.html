<!DOCTYPE html>
<!--
  motion-video composition skeleton (HyperFrames 0.8.77 + GSAP).
  Copy to <project>/index.html, then run `node scripts/build-timeline.mjs` to inject window.TIMING.
  Replace the style tokens and the scene markup with the resolved style: the base
  profile in references/styles/profiles/ (and its detail reference, if any) plus any
  layers from `scripts/resolve-style.py resolve` (see references/style-system.md).
  Layout reads the frame size from --W/--H so scripts/reframe.py can derive 1:1 and
  9:16 editions; put ratio-specific layout in html[data-ratio="..."] rules
  (see references/reframe.md).
-->
<html lang="en" data-resolution="landscape" data-ratio="16x9">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Motion video</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Fonts must be local files under assets/fonts so renders are deterministic. */
      @font-face { font-family: "Be Vietnam Pro"; src: url("assets/fonts/BeVietnamPro-Bold.ttf") format("truetype"); font-weight: 700; font-display: block; }
      :root { --bg: #070817; --ink: #f5f3ff; --accent: #c4b5fd; --W: 1920px; --H: 1080px; --cap-w: 1660px; --cap-bottom: 44px; --cap-size: 44px; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); }
      #root { position: relative; width: var(--W); height: var(--H); overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Be Vietnam Pro", sans-serif; }
      .layer { position: absolute; left: 0; top: 0; width: var(--W); height: var(--H); }
      .abs { position: absolute; }
      .scene { opacity: 0; visibility: hidden; }
      .hl .w { display: inline-block; }
      .draw { stroke-dasharray: 1; stroke-dashoffset: 1; }
      #flash { background: #fff; opacity: 0; pointer-events: none; }
      #fade { background: #000; opacity: 1; pointer-events: none; }
      /* captions stay left of the signature; bottom band is reserved for them */
      .cap { position: absolute; left: 0; width: var(--cap-w); bottom: var(--cap-bottom); display: flex; justify-content: center; }
      .cap-box { max-width: calc(var(--cap-w) - 260px); padding: 12px 28px; border-radius: 18px; background: rgba(10, 8, 30, 0.72); font: 700 var(--cap-size)/1.3 "Be Vietnam Pro"; text-align: center; }
      .cw { color: rgba(255, 255, 255, 0.5); }
      #sig { right: 40px; bottom: 22px; width: 250px; height: 130px; }
      #sig-txt { position: absolute; right: 18px; bottom: 26px; font: 72px/1 "Be Vietnam Pro"; color: #fff; }
      #sig svg { position: absolute; left: 0; top: 0; }
      .ghost { position: absolute; inset: 0; pointer-events: none; }
      .odo { display: inline-flex; font-variant-numeric: tabular-nums; }
      .odo-d { display: inline-block; height: 1em; line-height: 1; overflow: hidden; }
      .odo-s { display: block; }
      .odo-s i { display: block; height: 1em; font-style: normal; }
      /* Ratio editions (scripts/reframe.py sets data-ratio and --W/--H). Social apps
         cover the top and bottom of vertical video, so captions sit higher and larger. */
      html[data-ratio="1x1"] { --cap-w: 1080px; --cap-bottom: 64px; --cap-size: 46px; }
      html[data-ratio="9x16"] { --cap-w: 1080px; --cap-bottom: 440px; --cap-size: 56px; }
      html[data-ratio="1x1"] #sig, html[data-ratio="9x16"] #sig { transform: scale(0.7); transform-origin: 100% 100%; }
      html[data-ratio="9x16"] #sig { bottom: 300px; }
      html[data-ratio="1x1"] .hl, html[data-ratio="9x16"] .hl { left: 80px !important; right: 80px; font-size: 88px !important; }
      html[data-ratio="9x16"] .hl { top: 760px !important; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <div id="bg" class="layer"></div>
      <div id="pulse" class="layer">
        <div id="stage" class="layer">
          <!-- one .scene per script scene; the WINDOWS table below maps selector -> scene id -> transition -->
          <section id="sc01" class="scene layer">
            <div class="abs hl" style="left: 120px; top: 380px; font-size: 120px">Title here</div>
          </section>
          <section id="sc02" class="scene layer">
            <div class="abs hl" style="left: 120px; top: 380px; font-size: 96px">Feature one</div>
          </section>
        </div>
      </div>
      <div id="flash" class="layer"></div>
      <div id="captions" class="layer"></div>
      <div id="sig" class="abs">
        <svg viewBox="0 0 250 130" width="250" height="130"><path id="sig-line" class="draw" pathLength="1" d="M20,112 C80,100 150,118 236,96" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" /></svg>
        <div id="sig-txt">Zuey</div>
      </div>
      <div id="fade" class="layer"></div>
      <audio id="mix" src="assets/audio/mix.m4a" data-start="0" data-duration="60" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>/*TIMING:BEGIN*/window.TIMING=null;/*TIMING:END*/</script>
    <script>
      (() => {
        const T = window.TIMING;
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;

        // ---------- lookups: every time comes from TIMING, never from wall clock ----------
        const $ = (s, r = document) => r.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
        const SC = T.scenes;
        const B = (n) => T.beat0 + T.beatLen * n; // time of quarter note n
        const isKick = (n) => T.kick.some(([a, b]) => n >= a && n < b);
        const hit = (sid, word, nth) => {
          const h = SC[sid].lines.flatMap((l) => l.words).filter((w) => w[0] === word)[nth - 1];
          if (!h) console.warn(`[timing] "${word}" #${nth} missing in ${sid}`);
          return h;
        };
        const W = (sid, word, nth = 1) => (hit(sid, word, nth) || [0, SC[sid].start])[1]; // word onset
        const WE = (sid, word, nth = 1) => (hit(sid, word, nth) || [0, 0, SC[sid].start])[2]; // word end
        // seeded PRNG: Math.random would make every render different
        const rng = (seed) => () => {
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };

        // ---------- build the DOM before any tween ----------
        // headline words become spans for staggered entrances; inline accents (<em>, <b>) keep their tag
        const splitWords = (el) =>
          Array.from(el.childNodes).forEach((n) => {
            if (n.nodeType === 1) return n.namespaceURI === "http://www.w3.org/2000/svg" ? undefined : splitWords(n);
            if (n.nodeType !== 3) return;
            const frag = document.createDocumentFragment();
            n.textContent.split(/([ \t\r\n]+)/).forEach((p) => {
              if (!p) return;
              if (/^[ \t\r\n]+$/.test(p)) return frag.append(" ");
              const s = document.createElement("span");
              s.className = "w";
              s.textContent = p;
              frag.append(s);
            });
            n.replaceWith(frag);
          });
        $$(".hl").forEach(splitWords);
        // odometer: <span class="odo" data-value="40%"></span> gets one 0-9 reel per digit
        $$(".odo").forEach((o) => {
          o.setAttribute("data-layout-allow-overflow", ""); // reels clip on purpose
          const reel = Array.from({ length: 20 }, (_, i) => `<i>${i % 10}</i>`).join("");
          if (o.dataset.value == null) console.warn("[odo] missing data-value", o);
          o.innerHTML = Array.from(o.dataset.value ?? "").map((ch) => (/\d/.test(ch) ? `<span class="odo-d"><span class="odo-s">${reel}</span></span>` : `<span>${ch}</span>`)).join("");
        });

        // ---------- animation vocabulary ----------
        const pop = (e, t, o = {}) => tl.fromTo(e, { autoAlpha: 0, scale: o.from ?? 0.4 }, { autoAlpha: 1, scale: 1, duration: o.d ?? 0.45, ease: o.ease ?? "back.out(2.2)", stagger: o.stagger ?? 0 }, t);
        const rise = (e, t, o = {}) => tl.fromTo(e, { autoAlpha: 0, y: o.y ?? 40 }, { autoAlpha: 1, y: 0, duration: o.d ?? 0.5, ease: o.ease ?? "power3.out", stagger: o.stagger ?? 0 }, t);
        const draw = (e, t, d = 0.6, ease = "power2.inOut") => tl.fromTo(e, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d, ease }, t);
        const slideX = (e, t, o = {}) => tl.fromTo(e, { autoAlpha: 0, x: o.x ?? -80 }, { autoAlpha: 1, x: 0, duration: o.d ?? 0.5, ease: o.ease ?? "expo.out", stagger: o.stagger ?? 0 }, t);
        const flipIn = (e, t, o = {}) => tl.fromTo(e, { autoAlpha: 0, rotationX: o.rot ?? -80, transformPerspective: 1200, transformOrigin: "50% 100%" }, { autoAlpha: 1, rotationX: 0, duration: o.d ?? 0.6, ease: o.ease ?? "back.out(1.4)", stagger: o.stagger ?? 0 }, t);
        const fadeOut = (e, t, o = {}) => tl.to(e, { autoAlpha: 0, y: o.y ?? 0, duration: o.d ?? 0.3, ease: "power2.in" }, t);
        // bump: a quick scale accent on a word or a beat
        const bump = (e, t, o = {}) => {
          tl.to(e, { scale: o.s ?? 1.08, duration: 0.08, ease: "power2.out" }, t);
          tl.to(e, { scale: 1, duration: 0.3, ease: "power2.out" }, t + 0.08);
        };
        // typeIn: stepped clip reveal, one step per character (counts toward the clip-path budget)
        const typeIn = (e, t, o = {}) => {
          const el = typeof e === "string" ? $(e) : e;
          const n = Math.max(1, el.textContent.replace(/\s+/g, " ").trim().length), d = o.d ?? n * 0.035; // steps match glyphs in monospace
          tl.fromTo(el, { clipPath: "inset(-20% 100% -20% 0%)" }, { clipPath: "inset(-20% 0% -20% 0%)", duration: d, ease: `steps(${n})` }, t);
          tl.set(el, { clipPath: "none" }, t + d);
        };
        // odo: reels roll into the value from data-value; the last digit spins one extra turn
        const odo = (e, t, o = {}) => {
          const el = typeof e === "string" ? $(e) : e;
          const digits = Array.from(el.dataset.value ?? "").filter((c) => /\d/.test(c)).map(Number);
          $$(".odo-s", el).forEach((s, i) => {
            const idx = digits[i] + (i === digits.length - 1 ? 10 : 0);
            tl.fromTo(s, { yPercent: 0 }, { yPercent: -idx * 5, duration: (o.d ?? 1.1) + i * 0.08, ease: o.ease ?? "power3.out" }, t);
          });
        };
        // envKeys: keyframes from the voice envelope, e.g. envKeys(".m-mouth", on, off, 2 / 30, (v) => ({ scaleY: 0.2 + v }))
        const envKeys = (e, t0, t1, step, map) => {
          for (let t = t0; t < t1; t += step) {
            const v = T.env[Math.min(T.env.length - 1, Math.round(t * T.fps))] ?? 0;
            tl.to(e, { ...map(v), duration: step, ease: "none" }, t);
          }
        };
        // juicy vocabulary (references/motion-craft.md): anticipation, impact, smear, follow-through
        const FR = 1 / 30; // one frame
        // slam: lands oversized and blurred on t, squashes, settles. Energy 4-5 by default;
        // { soft: true } is the energy-3 version (smaller squash, back.out instead of elastic)
        const slam = (e, t, o = {}) => {
          const q = o.soft ? 0.5 : 1, t0 = Math.max(0, t - (o.d ?? 0.22)); // a tween before 0 would shift the whole timeline
          tl.fromTo(e, { autoAlpha: 0, scale: o.from ?? (o.soft ? 1.25 : 1.6), filter: `blur(${12 * q}px)` }, { autoAlpha: 1, scale: 1 - 0.06 * q, filter: "blur(0px)", duration: Math.max(FR, t - t0), ease: "expo.in" }, t0);
          tl.to(e, { scaleX: 1 + 0.06 * q, scaleY: 1 - 0.08 * q, duration: 3 * FR, ease: "power2.out" }, t);
          tl.to(e, { scaleX: 1, scaleY: 1, duration: 0.5, ease: o.soft ? "back.out(1.4)" : "elastic.out(1, 0.45)" }, t + 3 * FR);
          tl.set(e, { filter: "none" }, t + 4 * FR);
        };
        // smear: fast travel with skew (motion blur without a filter), then a damped settle
        const smear = (e, t, o = {}) => {
          const dx = o.dx ?? -260;
          tl.fromTo(e, { autoAlpha: 0, x: dx, skewX: dx < 0 ? -18 : 18 }, { autoAlpha: 1, x: 0, skewX: 0, duration: o.d ?? 0.34, ease: "expo.out", stagger: o.stagger ?? 0 }, t);
        };
        // lineIn: words rise out of an overflow:hidden line mask with overlap
        const lineIn = (e, t, o = {}) => tl.fromTo(e, { yPercent: 110, rotate: o.rot ?? 4 }, { yPercent: 0, rotate: 0, duration: o.d ?? 0.6, ease: "expo.out", stagger: { each: o.each ?? 0.06, ease: "power1.in" } }, t);
        // settleCam: slow camera push over a hold so no frame is dead (finite, seek-safe)
        const settleCam = (e, t0, t1, amt = 0.035) => tl.fromTo(e, { scale: 1 }, { scale: 1 + amt, duration: Math.max(0.1, t1 - t0), ease: "none" }, t0);
        // shake: seeded, decaying; x/y only so layout never reflows. Energy 4-5 only
        const shake = (e, t, o = {}) => {
          const r = rng(o.seed ?? 7), n = o.n ?? 6, amp = o.amp ?? 14;
          for (let i = 0; i < n; i++) {
            const k = amp * (1 - i / n);
            tl.to(e, { x: (r() - 0.5) * 2 * k, y: (r() - 0.5) * 2 * k, duration: FR, ease: "none" }, t + i * FR);
          }
          tl.to(e, { x: 0, y: 0, duration: 2 * FR, ease: "power2.out" }, t + n * FR);
        };
        const flash = (t, a = 0.45) => {
          // fromTo with explicit values: overlapping flashes render the same whatever the seek order
          tl.fromTo("#flash", { opacity: 0 }, { opacity: a, duration: 0.03, ease: "none", immediateRender: false }, t);
          tl.fromTo("#flash", { opacity: a }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, t + 0.03);
        };
        const intro = (sc, t) => {
          const ws = $$(".hl .w", sc);
          if (ws.length) tl.fromTo(ws, { autoAlpha: 0, yPercent: 60 }, { autoAlpha: 1, yPercent: 0, duration: 0.42, ease: "power3.out", stagger: 0.05 }, t + 0.05);
        };

        // ---------- beat reactions: pulse the stage on kick downbeats ----------
        tl.fromTo("#fade", { opacity: 1 }, { opacity: 0, duration: 0.3 }, 0);
        for (let n = 0; B(n) < T.duration && n < T.outroBeat; n++) {
          if (!isKick(n) || n % 4) continue;
          tl.to("#pulse", { scale: 1.01, duration: 0.05, ease: "power1.out" }, B(n));
          tl.to("#pulse", { scale: 1, duration: 0.33, ease: "power2.out" }, B(n) + 0.05);
        }

        // ---------- scene windows: [selector, scene id, transition in] ----------
        const WINDOWS = [
          ["#sc01", "s01-cover", "none"],
          ["#sc02", "s02-power-01", "up"],
        ];
        WINDOWS.forEach(([sel, sid, kind], i) => {
          const sc = $(sel);
          const t0 = SC[sid].start;
          const t1 = i < WINDOWS.length - 1 ? SC[WINDOWS[i + 1][1]].start : T.duration;
          if (kind === "none") tl.set(sc, { autoAlpha: 1 }, t0);
          else if (kind === "up") tl.fromTo(sc, { autoAlpha: 0, y: 110 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, t0);
          else if (kind === "fade") tl.fromTo(sc, { autoAlpha: 0 }, { autoAlpha: 1, duration: 1.2, ease: "power1.inOut" }, t0);
          if (i < WINDOWS.length - 1) tl.to(sc, { autoAlpha: 0, duration: 0.2, ease: "power2.in" }, t1 - 0.2);
          const onDrop = T.drops.some((n) => Math.abs(B(n) - t0) < 0.38); // the drop flash below covers it
          if (i > 0 && !onDrop) flash(t0, isKick(Math.round((t0 - T.beat0) / T.beatLen)) ? 0.3 : 0.14);
          intro(sc, t0);
        });
        T.drops.forEach((n) => flash(B(n), 0.8));

        // ---------- per-scene choreography: key every reveal to a spoken word ----------
        {
          const sid = "s02-power-01";
          pop("#sc02 .hl", W(sid, "offline") - 0.1);
        }

        // ---------- signature ----------
        tl.fromTo("#sig-txt", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(-20% -20% -20% 0%)", duration: 0.6, ease: "steps(8)" }, 1.0);
        draw("#sig-line", 1.45, 0.35, "power2.out");

        // ---------- Vietnamese karaoke captions ----------
        const capLayer = $("#captions");
        T.captions.forEach((c) => {
          const cap = document.createElement("div");
          cap.className = "cap";
          const box = document.createElement("div");
          box.className = "cap-box";
          const spans = c.words.map(([txt], j) => {
            if (j) box.append(" ");
            const s = document.createElement("span");
            s.className = "cw";
            s.textContent = txt;
            box.append(s);
            return s;
          });
          cap.append(box);
          capLayer.append(cap);
          tl.fromTo(cap, { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.14, ease: "power2.out" }, c.start);
          tl.to(cap, { autoAlpha: 0, duration: 0.12, ease: "power1.in" }, Math.max(c.start + 0.3, c.end - 0.12));
          c.words.forEach(([, s], j) => {
            tl.to(spans[j], { color: "#e9d5ff", duration: 0.05 }, s);
            const next = j < c.words.length - 1 ? c.words[j + 1][1] : Math.max(s + 0.35, c.end - 0.4);
            tl.to(spans[j], { color: "#ffffff", duration: 0.12 }, next);
          });
        });

        tl.to("#fade", { opacity: 1, duration: 1.0, ease: "power1.in" }, T.duration - 1.0);
        tl.set({}, {}, T.duration); // pin the timeline length to the video duration
      })();
    </script>
  </body>
</html>

[package]
name = "pxs_native_napi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
pxs_core_accel = { path = "../pxs_core_accel" }
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
rayon = "1.10"
crc32fast = "1.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
